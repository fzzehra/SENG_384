<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Glasses Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #fff; gap: 16px; }
h2 { font-size: 20px; opacity: 0.8; }
.wrap { position: relative; width: 640px; height: 480px; border-radius: 16px; overflow: hidden; }
#webcam { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#status { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 20px; font-size: 13px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button { padding: 8px 18px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; font-size: 13px; }
button.active { border-color: #6060e5; background: rgba(96,96,229,0.3); }
#startBtn { background: linear-gradient(135deg,#6060e5,#4646e5); border: none; font-size: 15px; padding: 12px 28px; }
.info { font-size: 12px; opacity: 0.7; text-align: center; max-width: 640px; }
</style>
</head>
<body>
<h2>3D Glasses AR Test</h2>
<div class="wrap">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="status">Click Start</div>
</div>
<div class="controls">
  <button id="startBtn" onclick="startCamera()">▶ Start Camera</button>
</div>
<div class="controls" id="glassesButtons" style="display:none">
  <button onclick="loadModel('glasses-1-.glb', this)">
    <canvas id="prev1" width="80" height="40" style="display:block; border-radius:6px;"></canvas>
  </button>
  <button onclick="loadModel('glasses-7.glb', this)">
    <canvas id="prev2" width="80" height="40" style="display:block; border-radius:6px;"></canvas>
  </button>
  <button onclick="loadModel('glasses-10.glb', this)">
    <canvas id="prev3" width="80" height="40" style="display:block; border-radius:6px;"></canvas>
  </button>
  <button onclick="loadModel('glasses-12.glb', this)">
    <canvas id="prev4" width="80" height="40" style="display:block; border-radius:6px;"></canvas>
  </button>
  <button onclick="clearModel(this)" class="active">None</button>
</div>
<div class="info" id="debugInfo">--</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

const video   = document.getElementById('webcam');
const canvas  = document.getElementById('overlay');
const status  = document.getElementById('status');
const debugEl = document.getElementById('debugInfo');

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(640, 480);
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 640/480, 0.1, 2000);
camera.position.set(0, 0, 0);
camera.lookAt(0, 0, -1);

scene.add(new THREE.AmbientLight(0xffffff, 2.2));
const dLight = new THREE.DirectionalLight(0xffffff, 1.2);
dLight.position.set(0, 1, 1);
scene.add(dLight);

const modelGroup = new THREE.Group();
scene.add(modelGroup);
window.modelGroup = modelGroup;

const loader = new THREE.GLTFLoader();
let model = null;
let modelNormScale = 1;
let modelReady = false;
const glassesConfig = {
  'glasses-1-.glb': { zOffset: 0.5, scale: 2.0 },
  'glasses-7.glb':  { zOffset: 1.4, scale: 1.85 },
  'glasses-10.glb': { zOffset: 2.0, scale: 1.9 },
  'glasses-12.glb': { zOffset: 2.5, scale: 2.0 },
};
// ── GLB'DEN OTOMATİK ÖNİZLEME ────────────────────────────────
window.generatePreview = function(file, canvasEl) {
  const previewRenderer = new THREE.WebGLRenderer({ 
    canvas: canvasEl, 
    antialias: true, 
    alpha: true 
  });
  previewRenderer.setSize(80, 40);
  previewRenderer.setClearColor(0x000000, 0);

  const previewScene = new THREE.Scene();
  previewScene.add(new THREE.AmbientLight(0xffffff, 2.5));
  const pLight = new THREE.DirectionalLight(0xffffff, 1.5);
  pLight.position.set(0, 1, 2);
  previewScene.add(pLight);

  const previewCamera = new THREE.PerspectiveCamera(35, 2, 0.1, 100);

  loader.load('/static/accessories/glasses/' + file, gltf => {
    const m = gltf.scene;
    const box = new THREE.Box3().setFromObject(m);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    m.position.sub(center);
    const maxDim = Math.max(size.x, size.y, size.z);
    previewCamera.position.z = maxDim * 1.8;
    previewScene.add(m);
    previewRenderer.render(previewScene, previewCamera);
  });
};

window.loadModel = function(file, btn) {
  if (btn) {
    document.querySelectorAll('#glassesButtons button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  while (modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]);
  modelReady = false;
  model = null;
  status.style.color = '#fff';
  status.textContent = 'Loading model: ' + file;

  loader.load('/static/accessories/glasses/' + file, gltf => {
    model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    model.position.sub(center).add(new THREE.Vector3(0, -0.05, 0));
   const cfg = glassesConfig[file] || { zOffset: 0.5, scale: 1.8 };
model.position.z -= cfg.zOffset;
model._scaleMultiplier = cfg.scale;
    modelGroup.add(model);
    modelNormScale = 1.0 / size.x;
    modelReady = true;
    status.textContent = 'Model başarıyla yüklendi ✓';
    status.style.color = '#49ff46';
  }, undefined, error => {
    console.error(error);
    status.textContent = 'Model yüklenemedi!';
    status.style.color = '#ff4646';
  });
};

window.clearModel = function(btn) {
  document.querySelectorAll('#glassesButtons button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  while (modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]);
  model = null;
  modelReady = false;
};

let faceLandmarker = null;
let running = false;

window.startCamera = async function() {
  document.getElementById('startBtn').style.display = 'none';
  status.textContent = 'Loading MediaPipe...';

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    outputFaceBlendshapes: false,
    outputFacialTransformationMatrixes: true,
    runningMode: "VIDEO",
    numFaces: 1
  });

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: 640, height: 480 }
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);

  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  renderer.setSize(video.videoWidth, video.videoHeight);
  camera.aspect = video.videoWidth / video.videoHeight;
  camera.updateProjectionMatrix();

  document.getElementById('glassesButtons').style.display = 'flex';
  setTimeout(() => {
  generatePreview('glasses-1-.glb', document.getElementById('prev1'));
  generatePreview('glasses-7.glb',  document.getElementById('prev2'));
  generatePreview('glasses-10.glb', document.getElementById('prev3'));
  generatePreview('glasses-12.glb', document.getElementById('prev4'));
}, 500);

  running = true;
  status.textContent = 'Detecting face...';
  renderLoop();
};

let lastTime = -1;

function renderLoop() {
  if (!running) return;
  requestAnimationFrame(renderLoop);

  const now = performance.now();
  if (video.readyState < 2 || now === lastTime) { renderer.render(scene, camera); return; }
  lastTime = now;

  const result = faceLandmarker.detectForVideo(video, now);
  if (!result.facialTransformationMatrixes?.length || !model || !modelReady) {
    renderer.render(scene, camera);
    return;
  }

  const mp = result.facialTransformationMatrixes[0].data;
  const m  = new THREE.Matrix4();
  m.set(
    mp[0], mp[4], mp[8],  mp[12],
    mp[1], mp[5], mp[9],  mp[13],
    mp[2], mp[6], mp[10], mp[14],
    mp[3], mp[7], mp[11], mp[15]
  );

  const pos    = new THREE.Vector3();
  const quat   = new THREE.Quaternion();
  const scaleV = new THREE.Vector3();
  m.decompose(pos, quat, scaleV);

  const lm = result.faceLandmarks[0];
  const bridgeNose = lm[168];
  const ndcX = (bridgeNose.x * 2) - 1;
  const ndcY = -(bridgeNose.y * 2) + 1;

  const depth = Math.abs(pos.z);
  const fovRad = THREE.MathUtils.degToRad(30);
  const halfScreenWorldHeight = Math.tan(fovRad) * depth;
  const halfScreenWorldWidth  = halfScreenWorldHeight * camera.aspect;

  pos.x = -(ndcX * halfScreenWorldWidth);
  pos.y = (ndcY * halfScreenWorldHeight) - 0.05;

  const faceDepth = Math.abs(pos.z);
  const W = canvas.width;
  const lEyePx = lm[33].x * W;
  const rEyePx = lm[263].x * W;
  const eyeDistPx = Math.abs(rEyePx - lEyePx);
  const eyeDistWorld = (eyeDistPx / W) * halfScreenWorldWidth * 2;

  pos.z = -faceDepth - (eyeDistWorld * 0.5);

  const qAynali = new THREE.Quaternion(quat.x, -quat.y, -quat.z, quat.w);

  const targetWidth = eyeDistWorld * (model._scaleMultiplier || 1.8);
  const finalScale  = targetWidth * modelNormScale;

  window.modelGroup.position.set(pos.x, pos.y - 0.1, pos.z);
  window.modelGroup.quaternion.copy(qAynali);
  window.modelGroup.scale.setScalar(finalScale);

  debugEl.textContent = `pos:(${pos.x.toFixed(1)},${pos.y.toFixed(1)},${pos.z.toFixed(1)}) eyeDist:${eyeDistPx.toFixed(0)}px scale:${finalScale.toFixed(3)}`;

  // ── OCCLUSION: YAW AÇISINA GÖRE FADE ──────────────────────────
  const euler = new THREE.Euler().setFromQuaternion(qAynali, 'YXZ');
  const yaw = euler.y;
  const yawAbs = Math.abs(yaw);
  const occlusionOpacity = THREE.MathUtils.clamp(
    THREE.MathUtils.mapLinear(yawAbs, 0.3, 0.7, 1.0, 0.0),
    0.0, 1.0
  );
  model.traverse(child => {
    if (!child.isMesh) return;
    if (!child.material._originalOpacity) {
      child.material = child.material.clone();
      child.material.transparent = true;
      child.material._originalOpacity = child.material.opacity || 1.0;
    }
    child.material.opacity = occlusionOpacity * child.material._originalOpacity;
  });

  renderer.render(scene, camera);
}
</script>
</script>
</body>
</html>
